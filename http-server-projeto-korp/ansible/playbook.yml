- name: Provisionar ambiente completo do projeto korp
  hosts: local
  become: true

  vars:
    project_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Atualizar cache de pacotes apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependências para adicionar o repositório Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Criar diretório para chaves de repositórios apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar a chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar o repositório oficial do Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Instalar Docker Engine, CLI e plugin do Compose (docker compose v2)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli 
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Garantir que o serviço Docker está ativo e habilitado no boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário atual ao grupo docker (uso sem sudo futuro)
      ansible.builtin.user:
        name: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        groups: docker
        append: true

    - name: Build da imagem e subida de todos os containers via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        build: always
        state: present
        pull: missing

    - name: Aguardar o serviço responder através do NGINX e validar o resultado
      ansible.builtin.uri:
        url: http://localhost/projeto-korp
        status_code: 200
        return_content: true
      register: korp_response
      retries: 10
      delay: 3
      until: korp_response.status == 200

    - name: Exibir a resposta do serviço no console
      ansible.builtin.debug:
        msg: "{{ korp_response.json }}"